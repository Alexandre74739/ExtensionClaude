<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Claude Folders</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1f1e1d;
        --muted: #73726c;
        --bg: #ffffff;
        --primary: #c96442;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f3f2ee;
          --muted: #a6a49c;
          --bg: #2a2926;
          --primary: #d97757;
        }
      }
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--fg);
        font:
          14px system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
      }
      button {
        width: 100%;
        padding: 8px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.08);
      }
      #status {
        margin: 10px 0 0;
      }
      .secondary {
        margin-top: 6px;
        border: 1px solid color-mix(in srgb, var(--fg) 20%, transparent);
        background: none;
        color: var(--fg);
      }
      #output {
        width: 100%;
        height: 140px;
        margin-top: 8px;
        box-sizing: border-box;
        font:
          10px ui-monospace,
          Consolas,
          monospace;
      }
    </style>
  </head>
  <body>
    <h1>Claude Folders</h1>
    <p>Les groupes de Claude s'affichent comme des dossiers.</p>
    <button id="copy" type="button">Copier le diagnostic</button>
    <button id="open" class="secondary" type="button">
      Afficher le diagnostic
    </button>
    <p id="status"></p>
    <textarea id="output" readonly hidden></textarea>
    <script src="popup.js"></script>
  </body>
</html>
